[project]
name = "rag-platform"
version = "0.1.0"
description = "Production RAG platform — pipeline plane (offline eval) tách khỏi serving plane (online)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Lõi cố ý giữ nhẹ: rag_core chỉ cần pydantic + numpy.
# Mọi thứ nặng (torch, qdrant, fastapi) nằm ở optional-dependencies để
# unit test chạy được trong vài giây mà không cần cài GPU stack.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# Phải khớp major/minor với image server trong infra/docker-compose.yml.
qdrant = [
    "qdrant-client>=1.15,<1.16",
]
pipeline = [
    "pyyaml>=6.0",
    "tqdm>=4.66",
]
# Parse tài liệu (W3-01). Nặng — kéo theo torchvision + opencv + rapidocr — nên
# **không** nằm trong `pipeline`: `rag_core.loaders` import docling lazy và
# đường `.txt`/`.md` chạy được khi thiếu nó hoàn toàn.
ingestion = [
    "docling>=2.121,<3",
    "easyocr>=1.7",
]
# Client cho API tương thích OpenAI (DeepSeek, OpenRouter). Cố ý không dùng SDK
# `openai`: chỉ cần đúng một endpoint, và cần kiểm soát chính xác phần retry +
# đọc `prompt_cache_hit_tokens` mà schema chuẩn không có.
llm = [
    "httpx>=0.27",
]
# Serving Plane (`W3-08`, `W4`). Tách khỏi `pipeline` vì hai plane chạy ở hai
# tiến trình khác nhau và **không** được kéo nhau vào: API phải khởi động trong
# vài trăm mili giây, còn `pipeline` kéo theo torch + docling.
#
# `arq` chọn thay vì Celery vì ba lý do đo được ở chỗ này: nó là asyncio thuần
# (cùng vòng lặp với FastAPI, không cần thêm một mô hình đồng thời thứ hai), nó
# chỉ cần Redis — thứ `docker-compose` đã có — thay vì thêm một broker, và toàn
# bộ nó gọn hơn để đọc khi phải hiểu chính xác hành vi retry.
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    # `W4-05`. `psycopg` v3 chọn thay `asyncpg` vì nó là **một** driver phục vụ
    # cả hai chế độ: Alembic chạy đồng bộ (`postgresql+psycopg`), đường request
    # chạy async (`postgresql+psycopg` với `create_async_engine`). Dùng asyncpg
    # thì migration vẫn cần thêm một driver đồng bộ, tức hai driver phải đồng ý
    # với nhau về kiểu dữ liệu — một chỗ lệch không ai kiểm.
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Alembic nằm ở đây, không ở `dev`: bước deploy chạy `alembic upgrade head`
    # **từ chính image này**, và đó là cách duy nhất bảo đảm migration và đoạn mã
    # giả định nó đã chạy được ship cùng nhau.
    "alembic>=1.13",
    # `W5-07`. ⭐ Ở đây dùng thư viện, khác quyết định của `W5-06` (viết tay
    # client Langfuse) — và phép thử phân biệt hai chỗ là **dữ liệu người dùng
    # có đi qua không**. Gói tin Langfuse mang nguyên văn prompt, nên phải kiểm
    # soát từng byte rời khỏi tiến trình (`tracing.redact`). Số đo Prometheus
    # không mang một ký tự nào của người dùng — chỉ tên metric, nhãn có tập hữu
    # hạn, và số. Không còn lý do để viết tay, mà định dạng phơi bày thì có đủ
    # thứ tinh vi (thứ tự `le`, `+Inf`, `_sum`/`_count`, escaping) để một bản tự
    # viết là một khoản nợ không đổi lại được gì.
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]
data = [
    "dvc>=3.55",
]
# `W6-05`. Locust kéo theo flask + gevent + geventhttpclient — cả một web stack
# chỉ để phát tải. Không nằm trong `dev`: CI chạy unit test không cần nó, và
# gevent vá monkey-patch thư viện chuẩn, thứ không nên có mặt trong cùng môi
# trường với `pytest-asyncio`.
loadtest = [
    "locust>=2.31",
]
# `W6-01`. Playwright kéo theo một trình duyệt ~150 MB tải riêng bằng
# `playwright install chromium`, nên nó **không** nằm trong `dev`: bốn tầng CI
# hiện tại không tầng nào chạy e2e (xem `.github/workflows/ci.yml`), và bắt mọi
# lần `uv sync --extra dev` tải một Chromium là đổi vài giây lấy vài phút.
ui = [
    "playwright>=1.47",
    "pytest-playwright>=0.5",
]
# `W6-02`. Demo công khai trên HF Spaces + ZeroGPU.
#
# ⚠️ `spaces` khai ở ĐÂY nhưng **không** được có mặt trong `space/requirements.txt`:
# nền tảng Space tự ghim phiên bản của nó, và một ghim thứ hai làm pip resolve
# hỏng lúc build. Khai ở đây để uv thấy được ràng buộc bắc cầu của nó (đáng kể
# nhất là `psutil`) và để `python space/app.py` chạy được trên máy dev — ngoài
# ZeroGPU thì `import spaces` là no-op thật, không cần try/except.
space = [
    "gradio>=5.0",
    "spaces>=0.30",
]
# MLflow chỉ dùng ở **pipeline plane** (theo dõi thí nghiệm offline). Để nó ngoài
# `pipeline` extra vì nó kéo theo cả một web stack (flask, alembic, sqlalchemy,
# gunicorn/waitress) chỉ để phục vụ UI — CI chạy unit test không cần thứ đó, và
# `pipeline/experiments/tracking.py` chạy đúng khi thiếu nó.
tracking = [
    "mlflow>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --------------------------------------------------------------------------
# uv — nguồn wheel cho torch
# --------------------------------------------------------------------------
# Trên Windows, wheel `torch` mặc định trên PyPI là bản **CPU-only**. Cài từ đó
# thì mọi thứ vẫn chạy, chỉ là chậm hơn ~10 lần và `torch.cuda.is_available()`
# trả False mà không báo lỗi gì — đúng kiểu hỏng âm thầm khiến người ta tưởng
# GPU yếu. Ghim index CUDA để `EMBEDDING_DEVICE=auto` thật sự chọn được `cuda`.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["packages/rag_core", "pipeline", "serving"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # Bản POC gốc. Cố ý không lint/format: nó là mốc so sánh cho `W1-13`, và sửa
    # format trên thứ sắp bị xoá ở `W6-05` chỉ tạo diff nhiễu. Xem legacy/README.md
    "legacy/",
    # Ruff format cũng định dạng lại code block Python bên trong Markdown. Với
    # tài liệu viết tay (README, các bản trình bày) đó là sửa ngoài ý muốn.
    "*.md",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "RUF001",  # ký tự Unicode "mơ hồ" — docstring tiếng Việt có dấu là cố ý
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
# `rag_core` sống trong `packages/` nên ruff không tự nhận ra là first-party.
# `guard`/`zerogpu` là mã của `space/`, nạp theo tên trần vì đó là cách HF Spaces
# chạy `app.py` — cùng lý do chúng cần một dòng ở `mypy_path` và `pythonpath`.
known-first-party = ["rag_core", "pipeline", "serving", "guard", "zerogpu"]

# --------------------------------------------------------------------------
# Mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "packages:space"
# `space` nằm trong danh sách này có chủ ý: mã chạy trên demo công khai chịu
# đúng mức kiểm như mã production. Nó **không** phải một package (`app.py` nạp
# `guard`/`zerogpu` theo tên trần vì đó là cách HF Spaces chạy), nên đường nạp
# đi qua `mypy_path` chứ không qua import tuyệt đối.
files = ["packages", "pipeline", "serving", "tests", "space"]
exclude = ["^legacy/"]
strict = true
warn_unreachable = true
# Thư viện bên thứ ba chưa có type stub — không để chúng làm hỏng strict mode của code mình
[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "qdrant_client.*",
    "torch.*",
    "pypdfium2.*",
    "locust.*",
    "spaces.*",
]
ignore_missing_imports = true

# `@spaces.GPU` không có stub, nên strict mode gọi mọi hàm nó bọc là "untyped".
# Nới đúng hai luật ấy cho đúng một module — chỗ duy nhất chạm tới decorator —
# thay vì tắt strict cho cả `space/`.
[[tool.mypy.overrides]]
module = ["zerogpu"]
disallow_untyped_decorators = false
warn_return_any = false

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `space/` không phải package (xem ghi chú ở `[tool.mypy]`), nên test của nó
# nạp `guard`/`zerogpu` theo tên trần — giống hệt cách `app.py` nạp trên Space.
pythonpath = ["space"]
# ⚠️ `-q` ĐÃ CÓ Ở ĐÂY — đừng thêm `-q` trên dòng lệnh nữa.
# `pytest -q` cộng với dòng này thành `-qq`, và `-qq` **tắt hẳn** dòng tổng kết
# ("974 passed in 267s"). Hệ quả không phải mỹ quan: ở `W2-05` tôi gõ `-q` theo
# phản xạ suốt cả phiên, nên mọi con số test báo ra đều là suy từ
# `--collect-only` cộng exit code chứ chưa lần nào đọc trực tiếp; và một vòng
# `until grep "passed"` canh file output đó đã quay vô ích 1h47m vì chuỗi ấy
# không bao giờ xuất hiện. Các target trong `Makefile` cố ý **không** thêm `-q`.
addopts = "-q --strict-markers"
# `strict` (mặc định) chứ không phải `auto`: test async phải tự khai
# `@pytest.mark.asyncio`. `auto` sẽ tự nhận mọi coroutine, kể cả một hàm helper
# đặt nhầm tên `test_*`, và nó chạy im lặng thay vì báo lỗi.
asyncio_mode = "strict"
markers = [
    # "ngoài" = ngoài Python thuần: service (Qdrant/Postgres/Redis) hoặc trọng số
    # model phải tải về (OCR ở `W3-02`). Điểm chung là chúng không chạy được
    # trong một vòng lặp `make test` vài giây.
    "integration: cần service ngoài hoặc trọng số model — chạy bằng `make test-integration`",
    "gpu: cần GPU cục bộ",
    "slow: chạy lâu, loại khỏi vòng lặp phát triển",
    # `W4-12`: nhãn để chạy riêng `-m security` khi red-team. KHÔNG bị loại
    # khỏi vòng chạy mặc định — chúng là Python thuần, nhanh, và là lưới hồi
    # quy cho bộ luật tiêm; một lưới chỉ chạy khi có người nhớ gọi là không lưới.
    "security: kiểm hàng rào bảo mật (tiêm prompt, PII) — vẫn chạy trong suite mặc định",
    # `W4-13`: khác `integration` ở chỗ nó cần **image đã build + compose đang
    # chạy**, không chỉ vài service lẻ. Loại khỏi cả `make test` lẫn
    # `make test-integration` vì một lượt của nó tốn hàng phút.
    "e2e: cần `make up-api` (image serving + toàn bộ compose) — chạy bằng `make smoke`",
    # `W5-09`. Khác `integration` ở **lý do** chậm: không phải service ngoài mà
    # là trọng số model phải tải về (docling layout/tableformer, EasyOCR). Vẫn
    # nằm trong `make test` ở máy đã `make install` — nhưng CI nhanh loại ra,
    # vì cài `ingestion` trên runner là ~4 GB và vài phút tải trọng số cho một
    # bộ test không đo gì thuộc về diff.
    #
    # ⚠️ Đây là **lỗ duy nhất** của tầng CI nhanh, nên nó bị khoá bằng
    # `tests/unit/test_ci_tiers.py`: thêm một module `weights` mà không sửa
    # danh sách khai báo ở đó thì đỏ.
    "weights: cần trọng số model tải về — loại khỏi tầng CI nhanh",
]

[tool.coverage.run]
source = ["packages/rag_core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
